[project]
name = "sarvam-s2s"
version = "0.1.0"
description = "Real-time Speech-to-Speech SDK powered by Sarvam AI — Gemini Live-like conversational AI for Indian languages"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Mithun Gowda B" }
]
keywords = ["speech-to-speech", "sarvam", "voice-ai", "real-time", "indian-languages", "tts", "stt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "websockets>=12.0,<14.0",
    "httpx>=0.27.0,<1.0",
    "sounddevice>=0.4.6,<1.0",
    "numpy>=1.24.0,<3.0",
    "pydantic>=2.0.0,<3.0",
]

[project.optional-dependencies]
sarvam-llm = ["sarvamai>=0.1.0"]
openai = ["openai>=1.30.0,<2.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[project.urls]
Homepage = "https://github.com/mithun50/Sarvam-S2S"
Documentation = "https://mithun50.github.io/Sarvam-S2S/"
Repository = "https://github.com/mithun50/Sarvam-S2S"
Issues = "https://github.com/mithun50/Sarvam-S2S/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sarvam_s2s"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
